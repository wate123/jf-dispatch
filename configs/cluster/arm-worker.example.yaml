version: 1
worker:
  id: arm-worker
  listen: "0.0.0.0:7100"
  advertise: "arm-worker.example.ts.net:7100"
  scheduler: "scheduler.example.ts.net:7000"
  ffmpeg: "/usr/bin/ffmpeg"
  max_jobs: 1
  preferred_accelerators: ["v4l2m2m", "cpu"]
storage: {media_paths: ["/media"], transcode_path: "/transcode"}
security: {token_file: "/etc/jf-dispatch/cluster-token", allowed_paths: ["/media", "/transcode"]}
